name: kst_business
description: "KST Business - Aplicación Inteligente de Cotizaciones de Key Solutions Technology"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  # Forms & Validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

  # PDF Generation
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.1
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4

  # Icons
  flutter_svg: ^2.0.16
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "iconoApp.png"
